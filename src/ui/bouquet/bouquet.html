<div class="bq-root">
  <p class="bq-hint" id="bq-hint" aria-hidden="true">
    Arrastra el ramo para girarlo
  </p>

  <div class="bq-panel__wrap">
    <article class="panel bq-panel" aria-label="Confirmar asistencia">
      <div class="bq-panel__handle" aria-hidden="true"></div>

      <div class="bq-panel__teaser">
        <header class="bq-head" aria-hidden="true">
          <p class="eyebrow eyebrow--paper">Confirmación</p>
          <h2 class="title title--paper bq-title">¿Nos acompañas?</h2>
          <p class="bq-message" id="bq-message" hidden></p>
          <p class="bq-count" id="bq-count" role="timer" aria-live="off">
            <span class="bq-count__lead" id="bq-count-lead"></span>
            <span class="bq-count__fine" id="bq-count-fine"></span>
          </p>
        </header>
        <button
          type="button"
          id="bq-open"
          class="btn btn--primary bq-open-btn"
          aria-expanded="false"
          aria-controls="bq-body"
        >
          Confirmar asistencia
        </button>
      </div>

      <div class="bq-panel__body" id="bq-body" hidden>
        <div class="bq-steps" aria-label="Continuar el recorrido" hidden>
          <button type="button" id="bq-prev" class="bq-step">← Anillos</button>
          <button type="button" id="bq-next" class="bq-step bq-step--next">Arco de deseos →</button>
        </div>
        <div class="bq-panel__body-scroll">
          <header class="bq-head">
            <p class="eyebrow eyebrow--paper">Confirmación</p>
            <h2 class="title title--paper bq-title">¿Nos acompañas?</h2>
            <p class="bq-message" id="bq-message-2" hidden></p>
            <p class="bq-count" id="bq-count-2" role="timer" aria-live="off">
              <span class="bq-count__lead" id="bq-count-lead-2"></span>
              <span class="bq-count__fine" id="bq-count-fine-2"></span>
            </p>
          </header>

          <form id="rsvp-form" class="form" novalidate>
            <fieldset class="choice">
              <legend>¿Podrás asistir?</legend>
              <label class="choice__opt">
                <input type="radio" name="attending" value="si" />
                <span>¡Sí, allí estaré!</span>
              </label>
              <label class="choice__opt">
                <input type="radio" name="attending" value="no" />
                <span>No podré acompañarlos</span>
              </label>
            </fieldset>

            <label class="field">
              <span>Tu nombre completo</span>
              <input name="name" required maxlength="80" autocomplete="name" />
              <small class="field__note">
                Si la invitación es para tu familia, escribe los nombres de quienes asistirán.
              </small>
            </label>

            <label class="field" data-when="si" hidden>
              <span>Alergias o restricciones alimentarias</span>
              <textarea
                name="allergies"
                rows="3"
                maxlength="300"
                placeholder="Ej: alergia al maní, vegetariano, celiaquía. Indica de quién es. Si no hay, déjalo vacío."
              ></textarea>
            </label>

            <label class="field">
              <span>Un mensaje para los novios (opcional)</span>
              <textarea name="comment" rows="2" maxlength="300"></textarea>
            </label>

            <input
              class="hp"
              type="text"
              name="website"
              tabindex="-1"
              autocomplete="off"
              aria-hidden="true"
            />
            <p class="form__error" role="alert" hidden></p>
            <button class="btn btn--primary" type="submit">
              Enviar confirmación
            </button>
          </form>

          <div class="done" id="rsvp-done" hidden>
            <p class="done__title" id="rsvp-done-title"></p>
            <p class="panel__text" id="rsvp-done-text"></p>
            <div class="actions">
              <a
                id="rsvp-whatsapp"
                class="btn btn--ghost"
                href="#"
                target="_blank"
                rel="noopener"
                >Avisar por WhatsApp</a
              >
              <button type="button" class="btn btn--ghost" id="rsvp-edit">
                Cambiar mi respuesta
              </button>
            </div>
          </div>

          <footer class="bq-sign">
            <p class="bq-sign__names" id="bq-names"></p>
            <p class="bq-sign__date" id="bq-date"></p>
          </footer>
        </div>
      </div>
    </article>
  </div>
</div>
