<button type="button" class="ring-label" data-ring="0" aria-label="Entrar al anillo"><span class="ring-label__text"></span></button>
<button type="button" class="ring-label" data-ring="1" aria-label="Entrar al anillo"><span class="ring-label__text"></span></button>

<p class="ring-note">Toca un anillo para entrar</p>
<div class="ring-cue scroll-cue" aria-hidden="true">
  <span>Desliza: El ramo</span>
  <i></i>
</div>

<div id="ring-hud" aria-hidden="true">
  <div class="ring-hud__top">
    <button type="button" class="ring-back" aria-label="Salir del anillo">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <p class="ring-title"></p>
  </div>
  <p class="ring-drag">Arrastra para girar</p>
  <div class="ring-hud__bottom">
    <button type="button" class="ring-step ring-step--prev" aria-label="Panel anterior">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="ring-dots"></div>
    <button type="button" class="ring-step ring-step--next" aria-label="Panel siguiente">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
</div>
<p class="ring-live" aria-live="polite"></p>
